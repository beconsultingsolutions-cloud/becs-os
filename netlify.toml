# Netlify build configuration for BECS OS (client-only SPA + Supabase)
# The Express server build was left over from the pre-Supabase migration and
# is no longer shipped to production. We build only the Vite client.

[build]
  command = "npm ci && npm run build:client"
  publish = "dist/public"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--no-audit --no-fund"

# SPA fallback — Wouter uses hash routing today, but this future-proofs any
# real path-based routes we add later.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-cache hashed assets; HTML always revalidates.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
